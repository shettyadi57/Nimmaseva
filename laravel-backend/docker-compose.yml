services:
  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nimmaseva

  # ── PHP-FPM (App) ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: app
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nimmaseva

  # ── Queue Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: worker
    volumes:
      - ./:/var/www
      - /var/www/vendor
    env_file:
      - .env
    depends_on:
      - app
      - redis
    networks:
      - nimmaseva
    restart: unless-stopped

  # ── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      target: scheduler
    volumes:
      - ./:/var/www
      - /var/www/vendor
    env_file:
      - .env
    depends_on:
      - app
      - mysql
    networks:
      - nimmaseva
    restart: unless-stopped

  # ── Laravel Reverb (WebSocket) ────────────────────────────────────────────
  reverb:
    build:
      context: .
      target: app
    command: php artisan reverb:start --host=0.0.0.0 --port=6001 --no-interaction
    ports:
      - "6001:6001"
    volumes:
      - ./:/var/www
      - /var/www/vendor
    env_file:
      - .env
    depends_on:
      - app
    networks:
      - nimmaseva
    restart: unless-stopped

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: nimmaseva
      MYSQL_USER: nimmaseva
      MYSQL_PASSWORD: nimmaseva_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nimmaseva", "-pnimmaseva_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimmaseva

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nimmaseva

networks:
  nimmaseva:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
